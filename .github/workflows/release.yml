name: Nova UI Release
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable preview APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/*.apk Multilaser-Nova-UI-v1.1.0-preview.apk
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-preview
          name: Multilaser Nova UI 1.1.0 Preview
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: Multilaser-Nova-UI-v1.1.0-preview.apk
