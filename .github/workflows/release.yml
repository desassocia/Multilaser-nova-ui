name: Preview release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable preview APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/*.apk "Multilaser-Nova-UI-${GITHUB_REF_NAME}-preview.apk"
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: "Multilaser Nova UI ${{ github.ref_name }}"
          prerelease: true
          generate_release_notes: true
          files: Multilaser-Nova-UI-${{ github.ref_name }}-preview.apk
